name: Build Docker images

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-24.04

    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        debian-version: ["bookworm"]
        include:
          - python-version: "3.12"
            debian-version: "trixie"
          - python-version: "3.13"
            debian-version: "trixie"
          - python-version: "3.14"
            debian-version: "trixie"

    steps:
      - name: Check out the repo
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - name: Build the Docker image
        shell: bash
        run: |
          docker buildx build . \
            --platform linux/amd64,linux/arm64 \
            --file Dockerfile \
            --tag engineervix/python-latex:${{ matrix.python-version }}-slim-${{ matrix.debian-version }}-$(date +'%Y%m%d%H%M%S') \
            --build-arg PYTHON_VERSION=${{ matrix.python-version }} \
            --build-arg DEBIAN_VERSION=${{ matrix.debian-version }} \
            --cache-from type=gha,scope=${{ matrix.python-version }}-${{ matrix.debian-version }} \
            --cache-to type=gha,mode=max,scope=${{ matrix.python-version }}-${{ matrix.debian-version }}

  # Creates a GitHub Release when the build job succeeds, and only on pushes to tags.
  release:
    needs: [build]

    permissions:
      contents: write

    if: needs.build.result == 'success' && startsWith( github.ref, 'refs/tags/v' )

    runs-on: ubuntu-24.04

    steps:
      - name: Check out the repo
        uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "npm"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          npm ci
      - name: Get the version
        id: get_version
        run: |
          echo "${{ github.ref }}"
          echo "VERSION=${GITHUB_REF/refs\/tags\//}" >> $GITHUB_OUTPUT
      - name: Generate Release Title
        id: get_release_title
        shell: bash
        run: |
          export TODAY="($(TZ=Africa/Lusaka date --iso))"
          echo "RELEASE_NAME=${{ steps.get_version.outputs.VERSION }} $TODAY" >> $GITHUB_OUTPUT
      - name: Extract Release Notes
        # This creates a file LATEST_RELEASE_NOTES.md in the parent directory (../)
        shell: bash
        run: |
          python3 utils/release.py notes
      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.get_release_title.outputs.RELEASE_NAME }}
          body_path: ../LATEST_RELEASE_NOTES.md
